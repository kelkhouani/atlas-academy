  <rect width="320" height="220" fill="#87CEEB" rx="16" opacity="0.4"/>
  <!-- Sun rays -->
  <g transform="translate(160,100)">
    <line x1="0" y1="-80" x2="0" y2="-55" stroke="#FFD166" stroke-width="6" stroke-linecap="round"/>
    <line x1="56" y1="-56" x2="39" y2="-39" stroke="#FFD166" stroke-width="6" stroke-linecap="round"/>
    <line x1="80" y1="0" x2="55" y2="0" stroke="#FFD166" stroke-width="6" stroke-linecap="round"/>
    <line x1="56" y1="56" x2="39" y2="39" stroke="#FFD166" stroke-width="6" stroke-linecap="round"/>
    <line x1="0" y1="80" x2="0" y2="55" stroke="#FFD166" stroke-width="6" stroke-linecap="round"/>
    <line x1="-56" y1="56" x2="-39" y2="39" stroke="#FFD166" stroke-width="6" stroke-linecap="round"/>
    <line x1="-80" y1="0" x2="-55" y2="0" stroke="#FFD166" stroke-width="6" stroke-linecap="round"/>
    <line x1="-56" y1="-56" x2="-39" y2="-39" stroke="#FFD166" stroke-width="6" stroke-linecap="round"/>
