<svg viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg">

  <!-- ── Ears (behind mane) ── -->
  <ellipse cx="57"  cy="68" rx="18" ry="16" fill="#C4581A"/>
  <ellipse cx="143" cy="68" rx="18" ry="16" fill="#C4581A"/>
  <ellipse cx="57"  cy="68" rx="10" ry="9"  fill="#F0A040"/>
  <ellipse cx="143" cy="68" rx="10" ry="9"  fill="#F0A040"/>

  <!-- ── Mane — outer spiky ring ── -->
  <circle cx="100" cy="118" r="82" fill="#5C1A00"/>

  <!-- ── Mane — mid layer ── -->
  <circle cx="100" cy="112" r="72" fill="#7B2D08"/>

  <!-- ── Mane — inner warm layer ── -->
  <circle cx="100" cy="106" r="64" fill="#9B4012"/>

  <!-- ── Face ── -->
  <circle cx="100" cy="100" r="55" fill="#F5A040"/>

  <!-- ── Forehead highlight ── -->
  <ellipse cx="100" cy="75" rx="28" ry="18" fill="#FFBC5A" opacity="0.55"/>

  <!-- ── Eye whites ── -->
  <ellipse cx="78"  cy="94" rx="17" ry="18" fill="white"/>
  <ellipse cx="122" cy="94" rx="17" ry="18" fill="white"/>

  <!-- ── Irises ── -->
  <circle cx="78"  cy="96" r="11" fill="#6B3420"/>
  <circle cx="122" cy="96" r="11" fill="#6B3420"/>

  <!-- ── Pupils ── -->
  <circle cx="80"  cy="94" r="7"  fill="#180800"/>
  <circle cx="124" cy="94" r="7"  fill="#180800"/>

  <!-- ── Eye shine ── -->
  <circle cx="83"  cy="90" r="3.2" fill="white"/>
  <circle cx="127" cy="90" r="3.2" fill="white"/>

  <!-- ── Muzzle ── -->
  <ellipse cx="100" cy="116" rx="22" ry="18" fill="#F0BE70"/>

  <!-- ── Nose ── -->
  <ellipse cx="100" cy="111" rx="9" ry="7" fill="#D04060"/>
  <!-- nose bridge line -->
  <line x1="100" y1="118" x2="100" y2="122" stroke="#D04060" stroke-width="2.5" stroke-linecap="round"/>

  <!-- ── Smile ── -->
  <path d="M 88,124 Q 100,134 112,124" fill="none" stroke="#9B4012" stroke-width="2.8" stroke-linecap="round"/>

  <!-- ── Whisker dots ── -->
  <circle cx="72"  cy="116" r="2" fill="#7B4820" opacity="0.45"/>
  <circle cx="80"  cy="121" r="2" fill="#7B4820" opacity="0.45"/>
  <circle cx="120" cy="116" r="2" fill="#7B4820" opacity="0.45"/>
  <circle cx="128" cy="121" r="2" fill="#7B4820" opacity="0.45"/>

  <!-- ── Body / chest peek ── -->
  <ellipse cx="100" cy="194" rx="48" ry="36" fill="#F5A040"/>
  <!-- chest cream patch -->
  <ellipse cx="100" cy="196" rx="28" ry="22" fill="#FFD888"/>

  <!-- ── Arms ── -->
  <ellipse cx="60"  cy="182" rx="22" ry="14" fill="#F5A040" transform="rotate(-30 60 182)"/>
  <ellipse cx="140" cy="182" rx="22" ry="14" fill="#F5A040" transform="rotate(30 140 182)"/>

  <!-- ── Paw pads left ── -->
  <ellipse cx="44"  cy="192" rx="10" ry="8"  fill="#E8905A"/>
  <circle  cx="38"  cy="185" r="4"            fill="#E8905A"/>
  <circle  cx="50"  cy="183" r="4"            fill="#E8905A"/>

  <!-- ── Paw pads right ── -->
  <ellipse cx="156" cy="192" rx="10" ry="8"  fill="#E8905A"/>
  <circle  cx="150" cy="183" r="4"           fill="#E8905A"/>
  <circle  cx="162" cy="185" r="4"           fill="#E8905A"/>

  <!-- ── Tail ── -->
  <path d="M 148,200 Q 190,180 178,155 Q 168,138 155,150"
        fill="none" stroke="#F5A040" stroke-width="12" stroke-linecap="round"/>
  <!-- tail tuft -->
  <circle cx="152" cy="152" r="13" fill="#5C1A00"/>
  <circle cx="152" cy="150" r="9"  fill="#7B2D08"/>

</svg>
